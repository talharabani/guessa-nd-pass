# Render blueprint for the Number Rush backend.
# Create the service from this file: Render → New → Blueprint → point at this repo.
#
# The frontend is NOT deployed here — it goes to Vercel (see DEPLOYMENT.md).

services:
  - type: web
    name: number-rush-server
    runtime: node
    plan: starter # 'free' works, but free instances sleep — bad for live sockets
    region: oregon
    rootDir: apps/server
    # --include=dev is required, not optional: NODE_ENV=production below makes
    # npm skip devDependencies, and the build needs TypeScript and the @types
    # packages to compile. Without it the install succeeds and `tsc` then fails
    # on every import with TS7016.
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000 # Render injects its own PORT; this is the documented default
      - key: DATABASE_URL
        fromDatabase:
          name: number-rush-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render creates a strong random value on first deploy
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set these to your real Vercel URL after the first frontend deploy.
      # Wildcards are rejected in production by src/env.ts.
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: number-rush-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: '16'
